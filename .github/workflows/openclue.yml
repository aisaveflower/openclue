name: openclue

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. v1.18.16-openclue.1)
        required: true
  push:
    branches: [openclue]
    tags: ["v*"]

jobs:
  # Typecheck and run the background-shell tests on Linux, where dependency
  # installation and the native typechecker are known-good.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install
      - name: Typecheck
        working-directory: packages/opencode
        run: bun run typecheck
      - name: Background shell tests
        working-directory: packages/opencode
        run: bun test test/tool/shell-background.test.ts --timeout 30000

  # Build the standalone Windows binary and publish it as an artifact.
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        shell: pwsh
        run: bun install
      - name: Build
        shell: pwsh
        working-directory: packages/opencode
        env:
          OPENCODE_CHANNEL: local
          OPENCODE_VERSION: 1.18.16-openclue.1
        run: bun run script/build.ts --single --skip-embed-web-ui
      - uses: actions/upload-artifact@v4
        with:
          name: openclue-windows-x64
          path: packages/opencode/dist/openclue-windows-x64/bin/openclue.exe
          if-no-files-found: error

  # Publish the built binary as a release: one download per improvement.
  release:
    needs: build-windows
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: openclue-windows-x64
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          test -f dist/openclue.exe
          gh release create "$TAG" dist/openclue.exe \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes "openclue: opencode with background shell jobs. Long commands keep running, you keep talking." \
            || gh release upload "$TAG" dist/openclue.exe --repo "$GITHUB_REPOSITORY" --clobber
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url
